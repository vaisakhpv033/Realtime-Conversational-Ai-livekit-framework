# LiveKit Server Configuration (Self-Hosted Production Stack)
port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50020
  use_external_ip: false

turn:
  enabled: true
  udp_port: 7882

redis:
  address: redis:6379

keys:
  devkey: secret_livekit_key_for_local_testing

logging:
  level: info
