apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-framework-worker
  namespace: livekit-agent-framework
  labels:
    app.kubernetes.io/name: livekit-agent-framework
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: livekit-agent-framework
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: livekit-agent-framework
        app.kubernetes.io/component: worker
    spec:
      # Graceful draining grace period ensuring active voice calls terminate cleanly
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: worker
          image: ghcr.io/your-org/agent-framework:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: agent-framework-config
            - secretRef:
                name: agent-framework-secrets
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HEALTH_CHECK_HOST
              value: "0.0.0.0"
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "1000m"
              memory: 2Gi
            limits:
              cpu: "2000m"
              memory: 4Gi
