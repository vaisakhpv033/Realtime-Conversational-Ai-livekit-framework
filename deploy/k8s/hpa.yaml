apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-framework-hpa
  namespace: livekit-agent-framework
  labels:
    app.kubernetes.io/name: livekit-agent-framework
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-framework-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      # 300s stabilization window prevents flapping while workers drain active calls
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
