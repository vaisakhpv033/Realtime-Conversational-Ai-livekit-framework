# LiveKit Voice Agent Framework - Worker Production Stack
# Connects outbound to LiveKit SFU (Cloud or Remote Self-Hosted Cluster)
# No public inbound media or WebRTC ports required.

services:
  agent-framework:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-framework-worker
    restart: unless-stopped
    stop_grace_period: 300s
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - HEALTH_CHECK_HOST=0.0.0.0
      - HEALTH_CHECK_PORT=8081
      - DRAIN_TIMEOUT_SECONDS=300
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Bound to loopback interface for local orchestrator health checks
      - "127.0.0.1:8081:8081"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
        reservations:
          cpus: "1.0"
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
